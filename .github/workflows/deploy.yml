name: Clinic System Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to AWS server
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd clinic-backend
            git pull origin main

            npm install
            npx prisma generate
            npm run build

            pm2 restart clinic-system || pm2 start dist/main.js --name clinic-system
